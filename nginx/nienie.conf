events { worker_connections 1024; }
http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/octet-stream text/css;
    server {
        listen 4090;
        server_name localhost 127.0.0.1;
        root /Volumes/Dpan/life/projcet/nienieDemo/output/squishy;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / { return 302 /games/squishy/$is_args$args; }
        location = /games { return 301 /games/$is_args$args; }
        location = /games/squishy { return 301 /games/squishy/$is_args$args; }
        location ~ /\. { return 404; }
        location /games/ {
            alias /Volumes/Dpan/life/projcet/nienieDemo/output/;
        }
        # Preserve direct local index.html/resource URLs, with real missing-file 404s.
        location / { try_files $uri $uri/ =404; }
    }
    server {
        listen 4091 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /Volumes/Dpan/life/projcet/nienieDemo/nginx/ssl.crt;
        ssl_certificate_key /Volumes/Dpan/life/projcet/nienieDemo/nginx/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /Volumes/Dpan/life/projcet/nienieDemo/output/squishy;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / { return 302 /games/squishy/$is_args$args; }
        location = /games { return 301 /games/$is_args$args; }
        location = /games/squishy { return 301 /games/squishy/$is_args$args; }
        location ~ /\. { return 404; }
        location /games/ {
            alias /Volumes/Dpan/life/projcet/nienieDemo/output/;
        }
        # Preserve direct local index.html/resource URLs, with real missing-file 404s.
        location / { try_files $uri $uri/ =404; }
    }
}
