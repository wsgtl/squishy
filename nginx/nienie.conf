events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP 服务器 - 本机开发调试
    server {
        listen 4090;
        server_name localhost 127.0.0.1;

        root /Volumes/Dpan/life/projcet/nienieDemo/output/web;
        index nienie.html;

        location / {
            try_files $uri $uri/ /nienie.html;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location ~* \.(wasm|pck|js|data)$ {
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    # HTTPS 服务器 - 局域网访问（手机调试）
    server {
        listen 4091 ssl;
        server_name 192.168.1.146 localhost 127.0.0.1;

        ssl_certificate /Volumes/Dpan/life/projcet/nienieDemo/nginx/ssl.crt;
        ssl_certificate_key /Volumes/Dpan/life/projcet/nienieDemo/nginx/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /Volumes/Dpan/life/projcet/nienieDemo/output/web;
        index nienie.html;

        # 大文件传输优化
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            try_files $uri $uri/ /nienie.html;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location ~* \.(wasm|pck|js|data)$ {
            add_header Access-Control-Allow-Origin "*" always;
            # 缓存静态资源
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}