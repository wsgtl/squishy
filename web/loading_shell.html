<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>描いて！握って！ぷにっこスクイーズ</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #e9dfff;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#loading-brand { display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; text-align:center; }
#loading-brand #status-splash { position:static; width:180px; height:180px; max-width:40vw; max-height:28vh; object-fit:contain; margin:0; }
#loading-title { color:#79668f; font:600 clamp(20px,4vw,30px)/1.6 system-ui,sans-serif; }
#status { width:min(100%, 56.25vh); width:min(100%, 56.25dvh); margin-inline:auto; }
#status-progress { appearance:none; -webkit-appearance:none; height:8px; border:0; border-radius:8px; overflow:hidden; background:#f8e5ee; accent-color:#ed8fb7; }
#status-progress::-webkit-progress-bar { background:#f8e5ee; border-radius:8px; }
#status-progress::-webkit-progress-value { background:#ed8fb7; border-radius:8px; }
#status-progress::-moz-progress-bar { background:#ed8fb7; border-radius:8px; }
@media (max-aspect-ratio: 1/1) { #status { width:100%; } }
</style>
		$GODOT_HEAD_INCLUDE

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="loading-brand"><img id="status-splash" src="$GODOT_SPLASH" alt=""><div id="loading-title">描いて！握って！<br>ぷにっこスクイーズ</div></div>
			<progress id="status-progress"></progress>
<div id="boot-detail" style="position:absolute;bottom:16%;color:#79668f;font:14px system-ui;text-align:center;padding:12px">読み込み中…</div>
<button id="boot-retry" style="display:none;position:absolute;bottom:3%;padding:10px 20px;border:0;border-radius:20px;background:#ed8fb7;color:white">再読み込み</button>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	const detail=document.getElementById('boot-detail'), retry=document.getElementById('boot-retry');
	let locale=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'ja';
	// Match the game's policy: other system languages default to Japanese.
	if(locale==='zh'){
		try{const saved=localStorage.getItem('punikko.language');if(saved==='zh'||saved==='ja')locale=saved;}catch(e){}
	}
	const zh=locale==='zh';
	document.documentElement.lang=zh?'zh-CN':'ja';
	detail.textContent=zh?'正在加载游戏…':'読み込み中…';
	let lastProgress=Date.now(), lastBytes=-1;
	const bootRows=[];
	window.punikkoBootStage=(stage)=>{
		bootRows.push({time:Date.now(),stage});
		try{sessionStorage.setItem('punikko.bootLog',JSON.stringify(bootRows));}catch(e){}
		lastProgress=Date.now();
		detail.textContent=zh?'正在启动游戏…':'ゲームを起動しています…';
		if(stage==='first_frame'){setStatusMode('hidden');}
	};
	retry.textContent=zh?'重新加载':'再読み込み';
	retry.onclick=()=>location.reload();
	const watchdog=setInterval(()=>{
		if(!initializing){clearInterval(watchdog);return;}
		if(Date.now()-lastProgress>30000){
			detail.textContent=zh?'启动时间较长，可稍候或重新加载':'起動に時間がかかっています。待つか再読み込みしてください。';
			retry.style.display='block';
		}
	},1000);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		retry.style.display='block';
		window.punikkoBootStage('error: '+String(err));
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = Math.min(90,current/total*90);
					statusProgress.max = 100;
					if(current!==lastBytes){lastBytes=current;lastProgress=Date.now();}
					detail.textContent=current>=total?(zh?'下载完成，正在初始化…':'ダウンロード完了。初期化中…'):(zh?'正在下载游戏…':'ダウンロード中…');
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			window.punikkoBootStage('engine_started');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
